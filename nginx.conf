# nginx für die statische RentBase-Website. TLS und Domains übernimmt der Coolify-Proxy (Traefik) davor.
# Datenschutz: kein Zugriffsprotokoll (keine IP-Adressen gespeichert), siehe Datenschutzerklärung Abschnitt 3.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    access_log off;
    error_log /dev/stderr warn;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gebündelte Dateien von Next.js tragen einen Inhalts-Hash im Namen und dürfen dauerhaft gecacht werden
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* \.(webp|png|svg|pdf|ico)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # /impressum -> impressum.html; Startseite und unbekannte Pfade sauber auflösen
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
